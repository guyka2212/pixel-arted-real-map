<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8' />
<meta name='viewport' content='width=device-width, initial-scale=1.0' />
<meta name='description' content='PIXEL WORLD - a real-world map rendered as pixel art. It uses your device location to show where you are.' />
<title>PIXEL WORLD - real map, retro pixels</title>
<link rel='preconnect' href='https://fonts.googleapis.com' />
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
<link href='https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap' rel='stylesheet' />
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<link rel='stylesheet' href='style.css' />
</head>
<body>
<div class='map' aria-label='Pixel art world map'></div>

<header class='hud'>
  <div class='hud-title'><span class='blink'>▶</span>&nbsp;PIXEL WORLD</div>
  <div class='hud-sub'>REAL-WORLD RETRO / YOUR POSITION</div>
  <div class='hud-coords'>
    <span class='dim'>LAT</span> <span class='hud-lat'>--.----</span>
    <span class='dim'>LON</span> <span class='hud-lng'>--.----</span>
    <span class='dim'>ZOOM</span> <span class='hud-zoom'>2</span>
  </div>
  <div class='hud-progress'><div class='hud-progress-bar'></div></div>
</header>

<div class='buttons'>
  <button class='pbtn btn-locate' title='Find my location'>
    <span class='pbtn-ico'>☾</span><span class='pbtn-txt'>LOCATE</span>
  </button>
  <button class='pbtn btn-settings' title='Pixel engine settings'>
    <span class='pbtn-ico'>⚙</span><span class='pbtn-txt'>PIXEL</span>
  </button>
</div>

<aside class='settings hidden' aria-label='Pixel settings'>
  <div class='settings-head'>
    <span class='blink'>▣</span>&nbsp;PIXEL ENGINE
    <button class='pbtn pbtn-sm btn-close-settings' title='Close'>&times;</button>
  </div>
  <label class='srow'>
    <span>PIXEL SIZE</span>
    <input type='range' class='pixel-scale' min='2' max='14' step='1' value='5' />
    <span class='sval pixel-scale-val'>5</span>
  </label>
  <label class='srow'>
    <span>COLOR DEPTH</span>
    <input type='range' class='pixel-levels' min='4' max='256' step='4' value='32' />
    <span class='sval pixel-levels-val'>32</span>
  </label>
  <label class='srow srow-check'>
    <span>SCANLINES</span>
    <input type='checkbox' class='scanlines' checked />
  </label>
  <div class='settings-note'>MAP DATA IS FROM OPENSTREETMAP.<br />CLICK THE MAP TO DROP A MARKER.<br />PRESS LOCATE TO FIND YOURSELF.</div>
</aside>

<div class='toast hidden' role='status'></div>

<div class='splash'>
  <div class='splash-box'>
    <div class='splash-ico'><span class='blink'>▣</span></div>
    <div class='splash-txt'>LOADING WORLD...</div>
    <div class='splash-bar'><div class='splash-bar-fill'></div></div>
  </div>
</div>

<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<script src='script.js'></script>
</body>
</html>
