<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="PIXEL WORLD - a real-world map rendered as pixel art. It uses your device location to show where you are." />
<title>PIXEL WORLD · real map, retro pixels</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0e1a'/%3E%3Crect x='2' y='2' width='6' height='6' fill='%2322c55e'/%3E%3Crect x='9' y='2' width='5' height='6' fill='%2300bfff'/%3E%3Crect x='2' y='9' width='6' height='5' fill='%23ff4d5a'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23fbbf24'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="map" aria-label="Pixel art world map"></div>

<!-- HUD -->
<header id="hud" aria-hidden="true">
  <div id="hud-title"><span class="blink">&#9654;</span>&nbsp;PIXEL WORLD</div>
  <div id="hud-sub">REAL-WORLD RETRO / YOUR POSITION</div>
  <div id="hud-coords">
    <span class="dim">LAT</span> <span id="hud-lat">--.----</span>
    <span class="dim">LON</span> <span id="hud-lng">--.----</span>
    <span class="dim">ZOOM</span> <span id="hud-zoom">2</span>
  </div>
  <div id="hud-progress"><div id="hud-progress-bar"></div></div>
</header>

<!-- Buttons -->
<div id="buttons">
  <button id="btn-locate" class="pbtn" title="Find my location">
    <span class="pbtn-ico">&#9782;</span><span class="pbtn-txt">LOCATE</span>
  </button>
  <button id="btn-settings" class="pbtn" title="Pixel engine settings">
    <span class="pbtn-ico">&#9881;</span><span class="pbtn-txt">PIXEL</span>
  </button>
</div>

<!-- Settings panel -->
<aside id="settings" class="hidden" aria-label="Pixel settings">
  <div id="settings-head">
    <span class="blink">&#9635;</span>&nbsp;PIXEL ENGINE
    <button id="btn-close-settings" class="pbtn pbtn-sm" title="Close">&times;</button>
  </div>
  <label class="srow">
    <span>PIXEL SIZE</span>
    <input type="range" id="pixel-scale" min="2" max="14" step="1" value="5" />
    <span class="sval" id="pixel-scale-val">5</span>
  </label>
  <label class="srow">
    <span>COLOR DEPTH</span>
    <input type="range" id="pixel-levels" min="4" max="256" step="4" value="32" />
    <span class="sval" id="pixel-levels-val">32</span>
  </label>
  <label class="srow srow-check">
    <span>SCANLINES</span>
    <input type="checkbox" id="scanlines" checked />
  </label>
  <div id="settings-note">MAP DATA &copy; OPENSTREETMAP.<br />CLICK THE MAP TO DROP A MARKER.<br />PRESS LOCATE TO FIND YOURSELF.</div>
</aside>

<!-- Toast -->
<div id="toast" class="hidden" role="status"></div>

<!-- Loading splash -->
<div id="splash">
  <div id="splash-box">
    <div id="splash-ico"><span class="blink">&#9635;</span></div>
    <div id="splash-txt">LOADING WORLD...</div>
    <div id="splash-bar"><div id="splash-bar-fill"></div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
